headers:
  x-api-key: "{{api_key}}"
body:
  type: json
  content: "{\r

    \  \"nama\": \"Andi Pratama\",\r

    \  \"nim\": \"2301001\",\r

    \  \"alamat\": { \"jalan\": \"Jl. Rajawali No. 5\", \"kota\": \"Palembang\" },\r

